name: Download Player Photos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create images directory
        run: mkdir -p images/players

      - name: Download player photos from Wikipedia
        run: |
          declare -A PLAYERS
          # Keys MUST match the player id in the AP array in index.html
          # Soccer (15)
          PLAYERS[gloukh]="Oscar_Gloukh"
          PLAYERS[solomon]="Manor_Solomon"
          PLAYERS[dperetz]="Daniel_Peretz_(footballer)"
          PLAYERS[khalili]="Anan_Khalaily"
          PLAYERS[dasa]="Eli_Dasa"
          PLAYERS[weissman]="Shon_Weissman"
          PLAYERS[glazer]="Omri_Glazer"
          PLAYERS[lemkin]="Stav_Lemkin"
          PLAYERS[nachmias]="Idan_Nachmias"
          PLAYERS[ddavid]="Dean_David_(footballer)"
          PLAYERS[abada]="Liel_Abada"
          PLAYERS[turgeman]="Dor_Turgeman"
          PLAYERS[feingold]="Ilay_Feingold"
          PLAYERS[toklomati]="Idan_Toklomati"
          PLAYERS[nlavi]="Neta_Lavi"
          # Handball
          PLAYERS[dayan_y]="Yonatan_Dayan_(handball_player)"
          # Basketball
          PLAYERS[tyus_a]="Alex_Tyus"
          PLAYERS[yaakov_n]="Noam_Yaakov"
          # Tennis
          PLAYERS[oliel_y]="Yishai_Oliel"
          PLAYERS[glushko_l]="Lina_Glushko"
          PLAYERS[buchnik_m]="Mika_Buchnik"
          PLAYERS[laron_m]="Maayan_Laron"

          SUCCESS=0
          FAIL=0
          NOPIC=0

          for PLAYER_ID in "${!PLAYERS[@]}"; do
            WIKI_PAGE="${PLAYERS[$PLAYER_ID]}"
            OUTPUT="images/players/${PLAYER_ID}.png"

            # Skip if already downloaded from previous run
            if [ -f "$OUTPUT" ] && [ "$(stat -c%s "$OUTPUT")" -gt 1000 ]; then
              echo "⏭️  ${PLAYER_ID} already exists, skipping"
              SUCCESS=$((SUCCESS + 1))
              continue
            fi

            echo "Looking up ${PLAYER_ID} (${WIKI_PAGE})..."

            sleep 3

            API_URL="https://en.wikipedia.org/api/rest_v1/page/summary/${WIKI_PAGE}"
            JSON=$(curl -sL -H "User-Agent: IsraeliAthletesTracker/1.0 (github.com/nadavw9; contact: nadavw9@users.noreply.github.com)" "$API_URL")

            IMG_URL=$(echo "$JSON" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              if 'originalimage' in data and data['originalimage'].get('source'):
                  print(data['originalimage']['source'])
              elif 'thumbnail' in data and data['thumbnail'].get('source'):
                  print(data['thumbnail']['source'])
              else:
                  print('')
          except:
              print('')
          " 2>/dev/null)

            if [ -z "$IMG_URL" ]; then
              echo "  ❌ No image on Wikipedia"
              NOPIC=$((NOPIC + 1))
              continue
            fi

            echo "  Downloading..."
            sleep 2

            HTTP_CODE=$(curl -sL -o "$OUTPUT" -w "%{http_code}" \
              -H "User-Agent: IsraeliAthletesTracker/1.0 (github.com/nadavw9; contact: nadavw9@users.noreply.github.com)" \
              "$IMG_URL")

            FILE_SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null || echo 0)

            if [ "$HTTP_CODE" = "200" ] && [ "$FILE_SIZE" -gt 1000 ]; then
              echo "  ✅ OK (${FILE_SIZE} bytes)"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ❌ Failed (HTTP ${HTTP_CODE}, ${FILE_SIZE} bytes)"
              rm -f "$OUTPUT"
              FAIL=$((FAIL + 1))
            fi
          done

          # Clean up old misnamed files from previous runs
          for OLD in khalaily lavi tyus peretz deandavid dayan yaakov oliel glushko buchnik laron; do
            if [ -f "images/players/${OLD}.png" ]; then
              echo "🗑️  Removing old misnamed file: ${OLD}.png"
              rm "images/players/${OLD}.png"
            fi
          done

          echo ""
          echo "========================================="
          echo "  Downloaded: ${SUCCESS}"
          echo "  Failed: ${FAIL}"
          echo "  No Wikipedia photo: ${NOPIC}"
          echo "========================================="
          ls -la images/players/

      - name: Commit and push images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A images/players/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📸 Download player photos from Wikipedia (fixed names)"
            git push
          fi
