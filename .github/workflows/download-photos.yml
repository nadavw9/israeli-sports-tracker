name: Download Player Photos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create images directory
        run: mkdir -p images/players

      - name: Download player photos from Wikipedia
        run: |
          declare -A PLAYERS
          # Map player tracker ID to Wikipedia page name
          # Soccer (15)
          PLAYERS[gloukh]="Oscar_Gloukh"
          PLAYERS[solomon]="Manor_Solomon"
          PLAYERS[peretz]="Daniel_Peretz_(footballer)"
          PLAYERS[khalaily]="Anan_Khalaily"
          PLAYERS[dasa]="Eli_Dasa"
          PLAYERS[weissman]="Shon_Weissman"
          PLAYERS[glazer]="Omri_Glazer"
          PLAYERS[lemkin]="Stav_Lemkin"
          PLAYERS[nachmias]="Idan_Nachmias"
          PLAYERS[deandavid]="Dean_David_(footballer)"
          PLAYERS[abada]="Liel_Abada"
          PLAYERS[turgeman]="Dor_Turgeman"
          PLAYERS[feingold]="Ilay_Feingold"
          PLAYERS[toklomati]="Idan_Toklomati"
          PLAYERS[lavi]="Neta_Lavi"
          # Handball
          PLAYERS[dayan]="Yonatan_Dayan_(handball_player)"
          # Basketball
          PLAYERS[tyus]="Alex_Tyus"
          PLAYERS[yaakov]="Noam_Yaakov"
          # Tennis
          PLAYERS[oliel]="Yishai_Oliel"
          PLAYERS[glushko]="Lina_Glushko"
          PLAYERS[buchnik]="Mika_Buchnik"
          PLAYERS[laron]="Maayan_Laron"

          SUCCESS=0
          FAIL=0

          for PLAYER_ID in "${!PLAYERS[@]}"; do
            WIKI_PAGE="${PLAYERS[$PLAYER_ID]}"
            API_URL="https://en.wikipedia.org/api/rest_v1/page/summary/${WIKI_PAGE}"
            OUTPUT="images/players/${PLAYER_ID}.png"

            echo "Looking up ${PLAYER_ID} (${WIKI_PAGE})..."

            # Get the Wikipedia summary JSON which contains thumbnail URL
            JSON=$(curl -sL -H "User-Agent: IsraeliAthletesTracker/1.0 (github.com/nadavw9)" "$API_URL")

            # Extract the original image URL (higher res than thumbnail)
            IMG_URL=$(echo "$JSON" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              # Try originalimage first (higher res), then thumbnail
              if 'originalimage' in data and data['originalimage'].get('source'):
                  print(data['originalimage']['source'])
              elif 'thumbnail' in data and data['thumbnail'].get('source'):
                  print(data['thumbnail']['source'])
              else:
                  print('')
          except:
              print('')
          " 2>/dev/null)

            if [ -z "$IMG_URL" ]; then
              echo "  ❌ No image found on Wikipedia"
              FAIL=$((FAIL + 1))
              continue
            fi

            echo "  Found: $IMG_URL"

            # Download the actual image
            HTTP_CODE=$(curl -sL -o "$OUTPUT" -w "%{http_code}" \
              -H "User-Agent: IsraeliAthletesTracker/1.0 (github.com/nadavw9)" \
              "$IMG_URL")

            FILE_SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null || echo 0)

            if [ "$HTTP_CODE" = "200" ] && [ "$FILE_SIZE" -gt 1000 ]; then
              echo "  ✅ OK (${FILE_SIZE} bytes)"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ❌ Download failed (HTTP ${HTTP_CODE}, ${FILE_SIZE} bytes)"
              rm -f "$OUTPUT"
              FAIL=$((FAIL + 1))
            fi
          done

          echo ""
          echo "========================================="
          echo "  Downloaded: ${SUCCESS}/22"
          echo "  Failed: ${FAIL}/22"
          echo "========================================="

          echo ""
          echo "Files in images/players/:"
          ls -la images/players/ || echo "(empty)"

      - name: Commit and push images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/players/
          if git diff --cached --quiet; then
            echo "No new images to commit"
          else
            git commit -m "📸 Download player photos from Wikipedia"
            git push
          fi
