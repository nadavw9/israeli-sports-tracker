name: Download Player Photos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create images directory
        run: mkdir -p images/players

      - name: Download Sofascore player images
        run: |
          declare -A PLAYERS
          # Soccer (15)
          PLAYERS[gloukh]=1155158
          PLAYERS[solomon]=862223
          PLAYERS[peretz]=1048265
          PLAYERS[khalaily]=1403362
          PLAYERS[dasa]=127846
          PLAYERS[weissman]=790817
          PLAYERS[glazer]=797083
          PLAYERS[lemkin]=1091923
          PLAYERS[nachmias]=827424
          PLAYERS[deandavid]=305964
          PLAYERS[abada]=965253
          PLAYERS[turgeman]=1005586
          PLAYERS[feingold]=1145681
          PLAYERS[toklomati]=1386727
          PLAYERS[lavi]=801830
          # Other sports (7)
          PLAYERS[dayan]=930748
          PLAYERS[tyus]=861539
          PLAYERS[yaakov]=1415687
          PLAYERS[oliel]=195179
          PLAYERS[glushko]=195315
          PLAYERS[buchnik]=350124
          PLAYERS[laron]=419640

          SUCCESS=0
          FAIL=0

          for PLAYER_ID in "${!PLAYERS[@]}"; do
            SOFASCORE_ID="${PLAYERS[$PLAYER_ID]}"
            URL="https://api.sofascore.app/api/v1/player/${SOFASCORE_ID}/image"
            OUTPUT="images/players/${PLAYER_ID}.png"

            echo "Downloading ${PLAYER_ID} (Sofascore ID: ${SOFASCORE_ID})..."

            HTTP_CODE=$(curl -sL -o "$OUTPUT" -w "%{http_code}" \
              -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
              "$URL")

            FILE_SIZE=$(stat -c%s "$OUTPUT" 2>/dev/null || echo 0)

            if [ "$HTTP_CODE" = "200" ] && [ "$FILE_SIZE" -gt 1000 ]; then
              echo "  ✅ OK (${FILE_SIZE} bytes)"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ❌ FAILED (HTTP ${HTTP_CODE}, ${FILE_SIZE} bytes)"
              rm -f "$OUTPUT"
              FAIL=$((FAIL + 1))
            fi
          done

          echo ""
          echo "========================================="
          echo "  Downloaded: ${SUCCESS}/22"
          echo "  Failed: ${FAIL}/22"
          echo "========================================="

          # List what we got
          echo ""
          echo "Files in images/players/:"
          ls -la images/players/ || echo "(empty)"

      - name: Commit and push images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/players/
          if git diff --cached --quiet; then
            echo "No new images to commit"
          else
            git commit -m "📸 Download player photos from Sofascore CDN"
            git push
          fi
